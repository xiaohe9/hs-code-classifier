apiVersion: apps/v1
kind: Deployment
metadata:
  name: hs-code
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hs-code
  template:
    metadata:
      labels:
        app: hs-code
    spec:
      containers:
      - name: hs-code
        image: hs-code:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: APP_VERSION
          value: "v1"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hs-code-svc
spec:
  type: NodePort
  selector:
    app: hs-code
  ports:
  - port: 80
    targetPort: 8000
    nodePort: 30080