services:
  mcp-server:
    build: .
    command: python app/mcp_server/taxonomy_server.py
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MCP_URL: http://mcp-server:8765/sse
    depends_on:
      - mcp-server
    restart: unless-stopped